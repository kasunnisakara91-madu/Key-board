name: BESTIE Keyboard CI / Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android Project Files
        run: |
          echo "Checking project files..."
          ls -la
          test -f gradlew || (echo "ERROR: gradlew is missing" && exit 1)
          test -f settings.gradle -o -f settings.gradle.kts || (echo "ERROR: settings.gradle is missing" && exit 1)
          test -f app/build.gradle -o -f app/build.gradle.kts || (echo "ERROR: app/build.gradle is missing" && exit 1)

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BESTIE-Keyboard-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
